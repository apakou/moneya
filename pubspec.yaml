name: moneya
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style logo.
  cupertino_icons: ^1.0.8

  # SVG rendering for the brand logo and other vector assets.
  flutter_svg: ^2.0.10
  phone_numbers_parser: ^9.0.21
  country_flags: ^4.1.2
  local_auth: ^2.3.0
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9+2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  gal: ^2.3.1
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  pdf: ^3.12.0
  printing: ^5.14.3

  # ---------------------------------------------------------------------------
  # W1 Foundations — network, secure storage, money, logging, app metadata.
  # See docs/backend/client-integration-notes.md for how these are wired up.
  # ---------------------------------------------------------------------------

  # HTTP client. Used by core/network/api_client.dart with 5 interceptors
  # (logging → auth → idempotency → trace → error-mapping) per the integration
  # notes §2. No raw DioException ever crosses the network-layer boundary;
  # callers receive ApiResult<T>.
  dio: ^5.7.0

  # Encrypted-at-rest key/value storage. Backs SessionStore (access + refresh
  # tokens, deviceId) and small client-only flags (onboarding-complete,
  # biometric-enabled, currency-preferred, locale-override) per integration
  # notes §3 + §12. SharedPreferences is intentionally NOT used for any of
  # these — fintech preference is encrypted KV.
  flutter_secure_storage: ^9.2.2

  # Arbitrary-precision decimal arithmetic. Server money fields are
  # decimal strings with ≤6 dp (Money schema in openapi.yaml). The client
  # never parses to double — see integration notes §10.
  decimal: ^3.0.2

  # App version + build number for the X-App-Version request header
  # (integration notes §2).
  package_info_plus: ^8.1.2

  # Structured leveled logging used by core/logging/app_logger.dart. Debug
  # builds print to console; release builds suppress info/debug and forward
  # errors to CrashReporter (no-op until PR7).
  logger: ^2.4.0

  # GetX — navigation + routing + utilities. Adopted project-wide so
  # every back affordance, forward route, and outcome-screen
  # popUntil resolves through a single navigator without threading
  # `BuildContext` to the call site. `GetMaterialApp` in main.dart
  # supplies the global navigator key Get.back() needs.
  #
  # Important: keep using the `popAfterFrame()` helper for any
  # back-action invoked from a Material splash (`InkWell`,
  # `ListTile`, pill buttons, `Tooltip`-wrapped widgets). Calling
  # `Get.back()` synchronously from those sites re-introduces the
  # deactivated-widget crash class — see core/widgets/safe_pop.dart.
  get: ^4.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Mocking framework for unit/widget tests. Used by test/core/** to
  # fake Dio adapters, SecureStorage, and SessionController collaborators.
  mocktail: ^1.0.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Launcher icon generator. Sourced from assets/launcher/app-launcher.png.
  # Run `dart run flutter_launcher_icons` after changes to regenerate
  # Android mipmaps + iOS AppIcon.appiconset.
  flutter_launcher_icons: ^0.14.4

# Launcher icon configuration. The source PNG is 4096×4096 RGBA which is
# well above the 1024×1024 floor iOS wants and the 432×432 floor Android
# adaptive icons want — flutter_launcher_icons downsamples to each density.
#
# Adaptive icon strategy (Android 8+): the same PNG is used as the
# foreground over a solid brand-deep-purple background. The OS masks the
# foreground to a circle / squircle / teardrop per device, so the inner
# safe zone (~66dp of the 108dp canvas) is what's actually visible. The
# current art has enough margin around the mark to survive that masking.
#
# iOS: a single 1024×1024 icon is rasterized into AppIcon.appiconset for
# every required size (iPhone, iPad, App Store, settings, notifications).
# `remove_alpha_ios: true` strips the alpha channel because the App Store
# rejects icons with transparency.
flutter_launcher_icons:
  image_path: "assets/launcher/app-launcher.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#2B0033"
  adaptive_icon_foreground: "assets/launcher/app-launcher.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generate AppLocalizations from .arb files in lib/l10n/. See l10n.yaml.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the logo in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/images/

  # Satoshi font — re-enable once .ttf files are placed in assets/fonts/.
  # Download from https://www.fontshare.com/fonts/satoshi
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
